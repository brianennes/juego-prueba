<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Habitación</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050508;color:#eee;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;cursor:default}#hud{position:fixed;left:20px;top:18px;pointer-events:none;text-shadow:0 2px 8px #000}#title{font-size:20px;font-weight:700;letter-spacing:.08em}#hint{margin-top:6px;font-size:13px;opacity:.8}#message{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);padding:10px 16px;border:1px solid #ffffff22;background:#000b;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}</style>
</head>
<body>
<canvas id="game"></canvas><div id="hud"><div id="title">LA HABITACIÓN</div><div id="hint">WASD · E interactuar · L luz · Click para interactuar</div></div><div id="message"></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),msg=document.getElementById('message');let W,H,light=true,door=false,near='';const p={x:.22,y:.68,s:.018},keys={};
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(1,0,0,1,0,0);x.scale(devicePixelRatio,devicePixelRatio);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='l')light=!light;if(e.key.toLowerCase()==='e'&&near)interact(near)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function say(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>msg.style.opacity=0,1500)}
function interact(obj){if(obj==='light')light=!light;if(obj==='door'){if(door)say('La puerta ya está abierta.');else{door=true;say('La puerta se abre...')}}if(obj==='piano')say('Do · Re · Mi... el piano todavía funciona.');}
function pianoKeyAt(mx,my){const px=W*.43,py=H*.21,pw=W*.24,ph=H*.25,whiteW=pw/7,whiteY=py+ph*.27,whiteH=ph*.45,blackW=whiteW*.58,blackY=whiteY,blackH=ph*.29;const blackIndex=[1,2,4,5,6];for(let n=0;n<blackIndex.length;n++){const i=blackIndex[n],bx=px+i*whiteW-blackW/2;if(mx>=bx&&mx<=bx+blackW&&my>=blackY&&my<=blackY+blackH)return ['C#','D#','F#','G#','A#'][n]}if(mx>=px&&mx<=px+pw&&my>=whiteY&&my<=whiteY+whiteH){const i=Math.floor((mx-px)/whiteW);return ['C','D','E','F','G','A','B'][i]}return null}
addEventListener('click',e=>{const mx=e.clientX,my=e.clientY;const note=pianoKeyAt(mx,my);if(note){say('♪ '+note);return}if(Math.hypot(mx-W*.75,my-H*.25)<24){interact('light');return}if(mx>=W*.79&&mx<=W*.90&&my>=H*.27&&my<=H*.72){interact('door');return}});
function loop(){update();draw();requestAnimationFrame(loop)}
function update(){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(dx,dy)||1;p.x=Math.max(.08,Math.min(.92,p.x+dx/l*p.s));p.y=Math.max(.14,Math.min(.86,p.y+dy/l*p.s));let objects={light:[.75,.25],door:[.845,.5],piano:[.55,.33]};near='';for(const[k,v]of Object.entries(objects))if(Math.hypot(p.x-v[0],p.y-v[1])<.1){near=k;break}}
function draw(){x.clearRect(0,0,W,H);x.fillStyle=light?'#202126':'#07070a';x.fillRect(0,0,W,H);let sx=W*.07,sy=H*.12,sw=W*.86,sh=H*.76;x.strokeStyle='#555';x.lineWidth=4;x.strokeRect(sx,sy,sw,sh);x.fillStyle='#15151a';x.fillRect(sx,sy+sh*.72,sw,sh*.28);
// ventana
x.fillStyle=light?'#26384b':'#090d14';x.fillRect(W*.16,H*.2,W*.22,H*.27);x.strokeStyle='#777';x.strokeRect(W*.16,H*.2,W*.22,H*.27);x.beginPath();x.moveTo(W*.27,H*.2);x.lineTo(W*.27,H*.47);x.moveTo(W*.16,H*.335);x.lineTo(W*.38,H*.335);x.stroke();
// puerta
x.fillStyle=door?'#18231b':'#30231f';x.fillRect(W*.79,H*.27,W*.11,H*.45);x.strokeStyle='#777';x.strokeRect(W*.79,H*.27,W*.11,H*.45);x.fillStyle='#d8b66a';x.beginPath();x.arc(W*.815,H*.5,5,0,Math.PI*2);x.fill();
// piano: una octava, 7 blancas + 5 negras, centrado y separado de la ventana
let px=W*.43,py=H*.21,pw=W*.24,ph=H*.25,whiteW=pw/7,whiteY=py+ph*.27,whiteH=ph*.45; x.fillStyle='#171218';x.fillRect(px,py,pw,ph*.72);
// teclas blancas independientes
for(let i=0;i<7;i++){x.fillStyle='#f0eee8';x.fillRect(px+i*whiteW,whiteY,whiteW-1,whiteH);x.strokeStyle='#555';x.lineWidth=1;x.strokeRect(px+i*whiteW,whiteY,whiteW-1,whiteH)}
// teclas negras independientes
x.fillStyle='#15151a';let blackW=whiteW*.58,blackH=ph*.29;[1,2,4,5,6].forEach(i=>{const bx=px+i*whiteW-blackW/2;x.fillRect(bx,whiteY,blackW,blackH);x.strokeStyle='#555';x.strokeRect(bx,whiteY,blackW,blackH)});
x.strokeStyle='#555';x.lineWidth=2;x.strokeRect(px,py,pw,ph*.72);
// lámpara
x.fillStyle=light?'#d5c08a':'#29262b';x.beginPath();x.arc(W*.75,H*.25,12,0,Math.PI*2);x.fill();
// jugador
x.fillStyle='#d9d9df';x.beginPath();x.arc(p.x*W,p.y*H,12,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(p.x*W+4,p.y*H-3,2,0,Math.PI*2);x.fill();
if(!light){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.globalCompositeOperation='destination-out';let g=x.createRadialGradient(p.x*W,p.y*H,20,p.x*W,p.y*H,190);g.addColorStop(0,'#fff');g.addColorStop(1,'#000');x.fillStyle=g;x.beginPath();x.arc(p.x*W,p.y*H,190,0,Math.PI*2);x.fill();x.globalCompositeOperation='source-over'}if(near){x.fillStyle='#fff';x.font='14px system-ui';x.textAlign='center';x.fillText('E · '+(near==='door'?'abrir puerta':near==='piano'?'tocar piano':'encender/apagar'),p.x*W,p.y*H-24)}}loop();
</script></body></html>

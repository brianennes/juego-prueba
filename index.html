<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Habitación</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050508;color:#eee;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;left:20px;top:18px;pointer-events:none;text-shadow:0 2px 8px #000}#title{font-size:20px;font-weight:700;letter-spacing:.08em}#hint{margin-top:6px;font-size:13px;opacity:.8}#message{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);padding:10px 16px;border:1px solid #ffffff22;background:#000b;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}#message.show{opacity:1}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="title">LA HABITACIÓN</div><div id="hint">WASD · E interactuar · L luz · CLICK interactuar</div></div><div id="message"></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),msg=document.getElementById('message');let W,H,light=true,door=false,near='';const p={x:.22,y:.68,s:.018},keys={};const rain=Array.from({length:90},()=>({x:.16+Math.random()*.22,y:.2+Math.random()*.27,v:.0015+Math.random()*.0025,l:.012+Math.random()*.018}));
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;const k=e.key.toLowerCase();if(k==='l')toggleLight();if(k==='e'&&near)interact(near)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),hit=hitTest(e.clientX-r.left,e.clientY-r.top);if(hit)interact(hit)});
function say(t){msg.textContent=t;msg.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>msg.classList.remove('show'),1800)}function toggleLight(){light=!light;say(light?'La luz se enciende.':'La luz se apaga.')}function pianoRect(){return{x:W*.39,y:H*.21,w:W*.24,h:H*.25}}function pianoKeys(){const q=pianoRect(),ww=q.w/7,bw=ww*.58,bh=q.h*.29;return{white:['C','D','E','F','G','A','B'].map((n,i)=>({note:n,x:q.x+i*ww,y:q.y+q.h*.27,w:ww-1,h:q.h*.45})),black:[['C#',1],['D#',2],['F#',4],['G#',5],['A#',6]].map(([n,i])=>({note:n,x:q.x+i*ww-bw/2,y:q.y+q.h*.27,w:bw,h:bh}))}}
function hitTest(mx,my){const q=pianoKeys();for(const k of q.black)if(mx>=k.x&&mx<=k.x+k.w&&my>=k.y&&my<=k.y+k.h)return'piano:'+k.note;for(const k of q.white)if(mx>=k.x&&mx<=k.x+k.w&&my>=k.y&&my<=k.y+k.h)return'piano:'+k.note;if(mx>=W*.825&&mx<=W*.847&&my>=H*.535&&my<=H*.595)return'light';if(mx>=W*.79&&mx<=W*.9&&my>=H*.27&&my<=H*.72)return'door';return null}function interact(kind){if(kind==='light')return toggleLight();if(kind==='door'){door=!door;say(door?'La puerta está abierta.':'La puerta está cerrada.');return}if(kind.startsWith('piano:'))playNote(kind.split(':')[1])}
function playNote(note){const freqs={C:261.63,'C#':277.18,D:293.66,'D#':311.13,E:329.63,F:349.23,'F#':369.99,G:392,'G#':415.3,A:440,'A#':466.16,B:493.88};const ac=playNote.ac||(playNote.ac=new(window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=freqs[note];g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.8);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.82);say('♪ '+note)}
function update(){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(dx,dy)||1;p.x=Math.max(.08,Math.min(.92,p.x+dx/l*p.s));p.y=Math.max(.14,Math.min(.86,p.y+dy/l*p.s));let objects={light:[.836,.565],door:[.845,.5],piano:[.51,.33]};near='';for(const[k,v]of Object.entries(objects))if(Math.hypot(p.x-v[0],p.y-v[1])<.1){near=k;break}for(const r of rain){r.y+=r.v;if(r.y>H*.47){r.y=H*.2;r.x=W*(.16+Math.random()*.22)}}}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#202126';x.fillRect(0,0,W,H);const sx=W*.07,sy=H*.12,sw=W*.86,sh=H*.76;x.strokeStyle='#555';x.lineWidth=4;x.strokeRect(sx,sy,sw,sh);x.fillStyle='#15151a';x.fillRect(sx,sy+sh*.72,sw,sh*.28);
x.fillStyle='#26384b';x.fillRect(W*.16,H*.2,W*.22,H*.27);x.strokeStyle='#777';x.strokeRect(W*.16,H*.2,W*.22,H*.27);x.beginPath();x.moveTo(W*.27,H*.2);x.lineTo(W*.27,H*.47);x.moveTo(W*.16,H*.335);x.lineTo(W*.38,H*.335);x.stroke();x.save();x.beginPath();x.rect(W*.16,H*.2,W*.22,H*.27);x.clip();x.strokeStyle='#9fb5c8';x.lineWidth=1;for(const r of rain){x.beginPath();x.moveTo(r.x*W,r.y*H);x.lineTo(r.x*W-W*.004,r.y*H+r.l*H);x.stroke()}x.restore();
if(door){x.fillStyle='#010102';x.fillRect(W*.79,H*.27,W*.11,H*.45);x.strokeStyle='#555';x.strokeRect(W*.79,H*.27,W*.11,H*.45)}else{x.fillStyle='#30231f';x.fillRect(W*.79,H*.27,W*.11,H*.45);x.strokeStyle='#777';x.strokeRect(W*.79,H*.27,W*.11,H*.45);x.fillStyle='#d8b66a';x.beginPath();x.arc(W*.815,H*.5,5,0,Math.PI*2);x.fill()}
x.fillStyle=light?'#b8b8b8':'#4b4b4b';x.fillRect(W*.825,H*.535,W*.022,H*.06);x.strokeStyle='#222';x.strokeRect(W*.825,H*.535,W*.022,H*.06);x.fillStyle=light?'#f2f2f2':'#242424';x.fillRect(W*.831,H*.548,W*.01,H*.033);
const q=pianoRect();x.fillStyle='#171218';x.fillRect(q.x,q.y,q.w,q.h*.72);const pk=pianoKeys();for(const k of pk.white){x.fillStyle='#f0eee8';x.fillRect(k.x,k.y,k.w,k.h);x.strokeStyle='#555';x.strokeRect(k.x,k.y,k.w,k.h)}for(const k of pk.black){x.fillStyle='#15151a';x.fillRect(k.x,k.y,k.w,k.h);x.strokeStyle='#555';x.strokeRect(k.x,k.y,k.w,k.h)}x.fillStyle='#d9d9df';x.beginPath();x.arc(p.x*W,p.y*H,12,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(p.x*W+4,p.y*H-3,2,0,Math.PI*2);x.fill();
if(!light){x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,0,W,H);x.globalCompositeOperation='destination-out';const g=x.createRadialGradient(p.x*W,p.y*H,25,p.x*W,p.y*H,230);g.addColorStop(0,'rgba(255,255,255,.98)');g.addColorStop(.55,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(p.x*W,p.y*H,230,0,Math.PI*2);x.fill();x.globalCompositeOperation='source-over'}if(near){x.fillStyle='#fff';x.font='14px system-ui';x.textAlign='center';x.fillText('E · '+(near==='door'?'abrir/cerrar puerta':near==='piano'?'tocar piano':'encender/apagar'),p.x*W,p.y*H-24)}}loop();
</script></body></html>

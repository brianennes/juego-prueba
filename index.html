<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Habitación</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202126;color:#eee;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;left:20px;top:18px;pointer-events:none;text-shadow:0 2px 8px #000}#title{font-size:20px;font-weight:bold}#hint{margin-top:6px;font-size:13px}#message{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);padding:10px 16px;background:#000c;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}#message.show{opacity:1}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="title">LA HABITACIÓN</div><div id="hint">WASD · E interactuar · L luz · CLICK interactuar</div></div><div id="message"></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),msg=document.getElementById('message');let W=0,H=0,light=true,door=false,near='';const player={x:.22,y:.68,s:.018},keys={};const rain=Array.from({length:70},()=>({x:.16+Math.random()*.22,y:.2+Math.random()*.27,v:.0015+Math.random()*.0025,l:.012+Math.random()*.018}));
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='l')toggleLight();if(k==='e'&&near)interact(near)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('click',e=>{const r=c.getBoundingClientRect();const hit=hitTest(e.clientX-r.left,e.clientY-r.top);if(hit)interact(hit)});
function say(t){msg.textContent=t;msg.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>msg.classList.remove('show'),1500)}function toggleLight(){light=!light;say(light?'Luz encendida':'Luz apagada')}
function pianoRect(){return{x:W*.39,y:H*.21,w:W*.24,h:H*.25}}function pianoKeys(){const q=pianoRect(),ww=q.w/7,bw=ww*.58;return{white:['C','D','E','F','G','A','B'].map((n,i)=>({n,x:q.x+i*ww,y:q.y+q.h*.27,w:ww-1,h:q.h*.45})),black:[['C#',1],['D#',2],['F#',4],['G#',5],['A#',6]].map(([n,i])=>({n,x:q.x+i*ww-bw/2,y:q.y+q.h*.27,w:bw,h:q.h*.29}))}}
function hitTest(mx,my){const k=pianoKeys();for(const z of k.black)if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h)return'piano:'+z.n;for(const z of k.white)if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h)return'piano:'+z.n;if(mx>=W*.825&&mx<=W*.85&&my>=H*.53&&my<=H*.61)return'light';if(mx>=W*.79&&mx<=W*.9&&my>=H*.27&&my<=H*.72)return'door';return null}
function interact(k){if(k==='light')toggleLight();else if(k==='door'){door=!door;say(door?'Puerta abierta':'Puerta cerrada')}else if(k.startsWith('piano:'))playNote(k.slice(7))}
function playNote(n){const f={C:261.63,'C#':277.18,D:293.66,'D#':311.13,E:329.63,F:349.23,'F#':369.99,G:392,'G#':415.3,A:440,'A#':466.16,B:493.88}[n];const ac=playNote.ac||(playNote.ac=new(window.AudioContext||window.webkitAudioContext)());ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.16,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.7);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.72);say('♪ '+n)}
function update(){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),m=Math.hypot(dx,dy)||1;player.x=Math.max(.08,Math.min(.92,player.x+dx/m*player.s));player.y=Math.max(.14,Math.min(.86,player.y+dy/m*player.s));const o={light:[.836,.565],door:[.845,.5],piano:[.51,.33]};near='';for(const k in o)if(Math.hypot(player.x-o[k][0],player.y-o[k][1])<.1){near=k;break}for(const r of rain){r.y+=r.v;if(r.y>H*.47){r.y=H*.2;r.x=W*(.16+Math.random()*.22)}}}
function windowDraw(){ctx.fillStyle='#26384b';ctx.fillRect(W*.16,H*.2,W*.22,H*.27);ctx.strokeStyle='#777';ctx.lineWidth=4;ctx.strokeRect(W*.16,H*.2,W*.22,H*.27);ctx.beginPath();ctx.moveTo(W*.27,H*.2);ctx.lineTo(W*.27,H*.47);ctx.moveTo(W*.16,H*.335);ctx.lineTo(W*.38,H*.335);ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(W*.16,H*.2,W*.22,H*.27);ctx.clip();ctx.strokeStyle='#aabfd0';ctx.lineWidth=1;for(const r of rain){ctx.beginPath();ctx.moveTo(r.x*W,r.y*H);ctx.lineTo(r.x*W-W*.004,r.y*H+r.l*H);ctx.stroke()}ctx.restore()}
function room(){ctx.fillStyle='#202126';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.strokeRect(W*.07,H*.12,W*.86,H*.76);ctx.fillStyle='#15151a';ctx.fillRect(W*.07,H*.12+H*.76*.72,W*.86,H*.76*.28);windowDraw();if(door){ctx.fillStyle='#010102';ctx.fillRect(W*.79,H*.27,W*.11,H*.45);ctx.strokeStyle='#555';ctx.strokeRect(W*.79,H*.27,W*.11,H*.45)}else{ctx.fillStyle='#30231f';ctx.fillRect(W*.79,H*.27,W*.11,H*.45);ctx.strokeStyle='#777';ctx.strokeRect(W*.79,H*.27,W*.11,H*.45);ctx.fillStyle='#d8b66a';ctx.beginPath();ctx.arc(W*.815,H*.5,5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#b8b8b8';ctx.fillRect(W*.825,H*.535,W*.022,H*.06);ctx.strokeStyle='#222';ctx.strokeRect(W*.825,H*.535,W*.022,H*.06);ctx.fillStyle='#f2f2f2';ctx.fillRect(W*.831,H*.548,W*.01,H*.033);const q=pianoRect();ctx.fillStyle='#171218';ctx.fillRect(q.x,q.y,q.w,q.h*.72);const pk=pianoKeys();for(const z of pk.white){ctx.fillStyle='#f0eee8';ctx.fillRect(z.x,z.y,z.w,z.h);ctx.strokeStyle='#555';ctx.strokeRect(z.x,z.y,z.w,z.h)}for(const z of pk.black){ctx.fillStyle='#15151a';ctx.fillRect(z.x,z.y,z.w,z.h);ctx.strokeStyle='#555';ctx.strokeRect(z.x,z.y,z.w,z.h)}ctx.fillStyle='#d9d9df';ctx.beginPath();ctx.arc(player.x*W,player.y*H,12,0,Math.PI*2);ctx.fill();if(near){ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='center';ctx.fillText('E · '+(near==='door'?'abrir/cerrar puerta':near==='piano'?'tocar piano':'encender/apagar'),player.x*W,player.y*H-24)}}
function draw(){ctx.clearRect(0,0,W,H);if(light){room()}else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);windowDraw()}}function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>

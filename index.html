<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Habitación</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#202126}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:18px;left:20px;color:white;font:14px Arial;text-shadow:0 2px 5px #000}</style></head><body><canvas id="game"></canvas><div id="hud"><b>LA HABITACIÓN</b><br>WASD · E interactuar · L luz · CLICK</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,light=true,door=false;const keys={};const player={x:.22,y:.68,s:.018};const rain=[];for(let i=0;i<90;i++)rain.push({x:.16+Math.random()*.22,y:.2+Math.random()*.47,v:.002+Math.random()*.002});
function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='l')light=!light});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);let m=Math.hypot(dx,dy)||1;player.x=Math.max(.08,Math.min(.92,player.x+dx/m*player.s));player.y=Math.max(.14,Math.min(.86,player.y+dy/m*player.s));for(const r of rain){r.y+=r.v;if(r.y>.67){r.y=.2;r.x=.16+Math.random()*.22}}}
function windowDraw(){ctx.fillStyle='#26384b';ctx.fillRect(W*.16,H*.2,W*.22,H*.47);ctx.strokeStyle='#777';ctx.lineWidth=4;ctx.strokeRect(W*.16,H*.2,W*.22,H*.47);ctx.beginPath();ctx.moveTo(W*.27,H*.2);ctx.lineTo(W*.27,H*.67);ctx.moveTo(W*.16,H*.435);ctx.lineTo(W*.38,H*.435);ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(W*.16,H*.2,W*.22,H*.47);ctx.clip();ctx.strokeStyle='#b5c9d8';ctx.lineWidth=1;for(const r of rain){ctx.beginPath();ctx.moveTo(r.x*W,r.y*H);ctx.lineTo(r.x*W-.004*W,r.y*H+.025*H);ctx.stroke()}ctx.restore()}
function roomDraw(){ctx.fillStyle='#202126';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.strokeRect(W*.07,H*.12,W*.86,H*.76);ctx.fillStyle='#15151a';ctx.fillRect(W*.07,H*.667,W*.86,H*.213);windowDraw();ctx.fillStyle=door?'#000':'#30231f';ctx.fillRect(W*.79,H*.27,W*.11,H*.45);ctx.strokeStyle='#777';ctx.strokeRect(W*.79,H*.27,W*.11,H*.45);if(!door){ctx.fillStyle='#d8b66a';ctx.beginPath();ctx.arc(W*.815,H*.5,5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#aaa';ctx.fillRect(W*.825,H*.535,W*.022,H*.06);ctx.fillStyle='#f2f2f2';ctx.fillRect(W*.831,H*.548,W*.01,H*.033);const px=W*.39,py=H*.21,pw=W*.24,ph=H*.25;ctx.fillStyle='#171218';ctx.fillRect(px,py,pw,ph*.72);const ww=pw/7;for(let i=0;i<7;i++){ctx.fillStyle='#f0eee8';ctx.fillRect(px+i*ww,py+ph*.27,ww-1,ph*.45);ctx.strokeStyle='#555';ctx.strokeRect(px+i*ww,py+ph*.27,ww-1,ph*.45)}for(const i of [1,2,4,5,6]){ctx.fillStyle='#15151a';ctx.fillRect(px+i*ww-ww*.29,py+ph*.27,ww*.58,ph*.29)}ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(player.x*W,player.y*H,12,0,Math.PI*2);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);if(light)roomDraw();else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);windowDraw()}}function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>

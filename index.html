<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Habitación</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#202126}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:18px;left:20px;color:white;font:14px Arial;text-shadow:0 2px 5px #000}</style></head><body><canvas id="game"></canvas><div id="hud"><b>LA HABITACIÓN</b><br>WASD · E interactuar · L luz · CLICK</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,light=true,door=false,near='';const keys={};const player={x:.22,y:.68,s:.008};const rain=[];for(let i=0;i<36;i++)rain.push({x:.16+Math.random()*.22,y:.2+Math.random()*.27,v:.002+Math.random()*.002});
function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='l')toggleLight();if(k==='e'&&near)interact(near)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function toggleLight(){light=!light}function toggleDoor(){door=!door}function interact(k){if(k==='light')toggleLight();else if(k==='door')toggleDoor()}addEventListener('click',e=>{const r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;if(mx>=W*.745&&mx<=W*.77&&my>=H*.47&&my<=H*.55)interact('light');else if(mx>=W*.79&&mx<=W*.9&&my>=H*.27&&my<=H*.72)interact('door')});
function update(){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),m=Math.hypot(dx,dy)||1;player.x=Math.max(.08,Math.min(.92,player.x+dx/m*player.s));player.y=Math.max(.14,Math.min(.86,player.y+dy/m*player.s));const angle=-100*Math.PI/180;for(const r of rain){r.x+=Math.cos(angle)*r.v;r.y+=-Math.sin(angle)*r.v;if(r.y>.47||r.x<.14){r.y=.2;r.x=.16+Math.random()*.22}}near='';if(Math.hypot(player.x-.7575,player.y-.522)<.09)near='light';else if(Math.hypot(player.x-.845,player.y-.5)<.12)near='door'}
function windowDraw(){ctx.fillStyle='#26384b';ctx.fillRect(W*.16,H*.2,W*.22,H*.27);ctx.strokeStyle='#777';ctx.lineWidth=4;ctx.strokeRect(W*.16,H*.2,W*.22,H*.27);ctx.beginPath();ctx.moveTo(W*.27,H*.2);ctx.lineTo(W*.27,H*.47);ctx.moveTo(W*.16,H*.335);ctx.lineTo(W*.38,H*.335);ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(W*.16,H*.2,W*.22,H*.27);ctx.clip();ctx.strokeStyle='#b5c9d8';ctx.lineWidth=1;const angle=-100*Math.PI/180;for(const r of rain){ctx.beginPath();const len=.025;ctx.moveTo(r.x*W,r.y*H);ctx.lineTo((r.x+Math.cos(angle)*len)*W,(r.y-Math.sin(angle)*len)*H);ctx.stroke()}ctx.restore()}
function roomDraw(){ctx.fillStyle='#202126';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.strokeRect(W*.07,H*.12,W*.86,H*.76);ctx.fillStyle='#15151a';ctx.fillRect(W*.07,H*.72,W*.86,H*.16);windowDraw();ctx.fillStyle=door?'#000':'#30231f';ctx.fillRect(W*.79,H*.27,W*.11,H*.45);ctx.strokeStyle='#777';ctx.strokeRect(W*.79,H*.27,W*.11,H*.45);if(!door){ctx.fillStyle='#d8b66a';ctx.beginPath();ctx.arc(W*.815,H*.5,5,0,Math.PI*2);ctx.fill()}const sx=W*.745,sy=H*.485;ctx.fillStyle='#999';ctx.fillRect(sx,sy,W*.025,H*.075);ctx.strokeStyle='#444';ctx.strokeRect(sx,sy,W*.025,H*.075);ctx.fillStyle=light?'#eee':'#222';ctx.fillRect(sx+W*.004,sy+H*.012,W*.017,H*.05);const pw=W*.24,ph=H*.25,px=(W-pw)/2,py=(H-ph)/2;ctx.fillStyle='#171218';ctx.fillRect(px,py,pw,ph*.72);const ww=pw/7;for(let i=0;i<7;i++){ctx.fillStyle='#f0eee8';ctx.fillRect(px+i*ww,py+ph*.27,ww-1,ph*.45);ctx.strokeStyle='#555';ctx.strokeRect(px+i*ww,py+ph*.27,ww-1,ph*.45)}for(const i of [1,2,4,5,6]){ctx.fillStyle='#15151a';ctx.fillRect(px+i*ww-ww*.29,py+ph*.27,ww*.58,ph*.29)}ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(player.x*W,player.y*H,12,0,Math.PI*2);ctx.fill();if(near){ctx.fillStyle='#fff';ctx.font='13px Arial';ctx.textAlign='center';ctx.fillText('E · interactuar',player.x*W,player.y*H-22)}}
function draw(){ctx.clearRect(0,0,W,H);if(light)roomDraw();else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);windowDraw()}}function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>

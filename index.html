<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Habitación</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#202126}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:18px;left:20px;color:white;font:14px Arial;text-shadow:0 2px 5px #000}</style></head><body><canvas id="game"></canvas><div id="hud"><b>LA HABITACIÓN</b><br>WASD · E interactuar · L luz · CLICK</div><script>
/* =============================================================
   🧩 1. CONFIGURACIÓN GENERAL
   ============================================================= */
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,light=true,door=false,near='';const keys={};const player={x:.22,y:.68,s:.008};const FLOOR_Y=.68;const cat={x:.68,y:FLOOR_Y,tx:.68,timer:0,patience:0,annoyedUntil:0};const rain=[];for(let i=0;i<36;i++)rain.push({x:.16+Math.random()*.22,y:.2+Math.random()*.27,v:.002+Math.random()*.002});const piano={x:0,y:0,w:.24,h:.25};let audioCtx=null;const whiteNotes=[261.63,293.66,329.63,349.23,392,440,493.88],blackNotes={1:277.18,2:311.13,4:369.99,5:415.3,6:466.16};
/* =============================================================
   🖥️ 2. RESOLUCIÓN / TECLADO
   ============================================================= */
function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='l')toggleLight();if(k==='e'&&near)interact(near)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
/* =============================================================
   💡🚪 3. INTERACCIONES + SONIDOS
   ============================================================= */
function audioReady(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function toggleLight(){audioReady();playSwitchSound(light);light=!light}
function toggleDoor(){audioReady();playDoorSound(door);door=!door}
function interact(k){if(k==='light')toggleLight();else if(k==='door')toggleDoor();else if(k.startsWith('piano:')){const type=k.split(':')[1],idx=+k.split(':')[2];playNote(type==='black'?blackNotes[idx]:whiteNotes[idx])}}
/* =============================================================
   🔊 4. SONIDOS DEL MUNDO
   Piano, interruptor y puerta.
   ============================================================= */
function playNote(freq){const a=audioReady(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.22,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.9);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.95)}
function playSwitchSound(wasOn){const a=audioReady(),o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.setValueAtTime(wasOn?180:130,a.currentTime);o.frequency.exponentialRampToValueAtTime(wasOn?110:85,a.currentTime+.055);g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.09);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1)}
function playDoorSound(wasOpen){const a=audioReady(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(wasOpen?170:115,a.currentTime);o.frequency.exponentialRampToValueAtTime(wasOpen?80:55,a.currentTime+.28);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.36);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.4);const click=a.createOscillator(),cg=a.createGain();click.type='square';click.frequency.value=wasOpen?900:650;cg.gain.setValueAtTime(.035,a.currentTime+.28);cg.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.34);click.connect(cg);cg.connect(a.destination);click.start(a.currentTime+.27);click.stop(a.currentTime+.35)}
/* =============================================================
   🐈‍⬛ 5. RONRONEO + PACIENCIA DEL GATO
   ============================================================= */
function startPurr(){const a=audioReady(),now=a.currentTime,master=a.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.075,now+.08);master.gain.exponentialRampToValueAtTime(.0001,now+1.5);master.connect(a.destination);const osc=a.createOscillator(),lfo=a.createOscillator(),lfoGain=a.createGain();osc.type='sawtooth';osc.frequency.value=24;lfo.frequency.value=5.5;lfoGain.gain.value=10;lfo.connect(lfoGain);lfoGain.connect(osc.frequency);osc.connect(master);osc.start(now);lfo.start(now);osc.stop(now+1.55);lfo.stop(now+1.55);const noise=a.createBufferSource(),buf=a.createBuffer(1,a.sampleRate*.8,a.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noise.buffer=buf;const filter=a.createBiquadFilter();filter.type='lowpass';filter.frequency.value=260;const ng=a.createGain();ng.gain.setValueAtTime(.0001,now);ng.gain.exponentialRampToValueAtTime(.018,now+.08);ng.gain.exponentialRampToValueAtTime(.0001,now+1.45);noise.connect(filter);filter.connect(ng);ng.connect(a.destination);noise.start(now);noise.stop(now+1.5)}
function catHit(mx,my){return Math.hypot(mx-cat.x,my-cat.y)<.035}function petCat(){if(performance.now()>cat.annoyedUntil){cat.patience++;if(cat.patience<=4)startPurr();else{cat.annoyedUntil=performance.now()+4500;cat.patience=0;cat.tx=.1+Math.random()*.68}}}
/* =============================================================
   🎹 6. COLISIÓN / INTERACCIÓN DEL PIANO
   ============================================================= */
function hitPiano(mx,my){const px=piano.x,py=piano.y,pw=piano.w,ph=piano.h,ww=pw/7,whiteTop=py+ph*.27,whiteBottom=py+ph*.72;if(mx<px||mx>px+pw||my<whiteTop||my>whiteBottom)return false;const blackTop=whiteTop,blackBottom=py+ph*.56;for(const i of [1,2,4,5,6]){const bx=px+i*ww-ww*.29;if(mx>=bx&&mx<=bx+ww*.58&&my>=blackTop&&my<=blackBottom){playNote(blackNotes[i]);return true}}const i=Math.max(0,Math.min(6,Math.floor((mx-px)/ww)));playNote(whiteNotes[i]);return true}
/* =============================================================
   🖱️ 7. CLICK DEL MOUSE
   ============================================================= */
addEventListener('click',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/W,my=(e.clientY-r.top)/H;if(hitPiano(mx,my))return;if(catHit(mx,my)){petCat();return}if(mx>=.745&&mx<=.77&&my>=.47&&my<=.56)interact('light');else if(mx>=.79&&mx<=.9&&my>=.27&&my<=.72)interact('door')});
/* =============================================================
   🎹 8. DETECCIÓN DE TECLA BAJO EL PERSONAJE
   ============================================================= */
function pianoKeyAt(x,y){const px=.5-piano.w/2,py=.5-piano.h/2,pw=piano.w,ph=piano.h,ww=pw/7,top=py+ph*.27,bottom=py+ph*.72;if(x<px||x>px+pw||y<top||y>bottom)return null;const blackBottom=py+ph*.56;for(const i of [1,2,4,5,6]){const bx=px+i*ww-ww*.29;if(x>=bx&&x<=bx+ww*.58&&y>=top&&y<=blackBottom)return `piano:black:${i}`}const i=Math.max(0,Math.min(6,Math.floor((x-px)/ww)));return `piano:white:${i}`}
/* =============================================================
   💡 9. DETECCIÓN DEL INTERRUPTOR
   ============================================================= */
function lightAt(x,y){return x>=.745&&x<=.77&&y>=.47&&y<=.56?'light':null}
/* =============================================================
   🚶🐈‍⬛🌧️ 10. ACTUALIZACIÓN DEL MUNDO
   El gato ahora se desplaza SOLO horizontalmente por el suelo.
   ============================================================= */
function update(){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),m=Math.hypot(dx,dy)||1;player.x=Math.max(.08,Math.min(.92,player.x+dx/m*player.s));player.y=Math.max(.14,Math.min(.86,player.y+dy/m*player.s));cat.timer--;if(performance.now()>cat.annoyedUntil&&cat.timer<=0){cat.timer=120+Math.random()*240;cat.tx=.13+Math.random()*.64;cat.y=FLOOR_Y}const cdx=cat.tx-cat.x;if(performance.now()>cat.annoyedUntil&&Math.abs(cdx)>.01)cat.x+=Math.sign(cdx)*.0007;cat.y=FLOOR_Y;const angle=-100*Math.PI/180;for(const r of rain){r.x+=Math.cos(angle)*r.v;r.y+=-Math.sin(angle)*r.v;if(r.y>.47||r.x<.14){r.y=.2;r.x=.16+Math.random()*.22}}near=pianoKeyAt(player.x,player.y)||lightAt(player.x,player.y)||'';if(!near&&player.x>=.79&&player.x<=.9&&player.y>=.27&&player.y<=.72)near='door'}
/* =============================================================
   🪟 11. VENTANA / LLUVIA
   ============================================================= */
function windowDraw(){ctx.fillStyle='#26384b';ctx.fillRect(W*.16,H*.2,W*.22,H*.27);ctx.strokeStyle='#777';ctx.lineWidth=4;ctx.strokeRect(W*.16,H*.2,W*.22,H*.27);ctx.beginPath();ctx.moveTo(W*.27,H*.2);ctx.lineTo(W*.27,H*.47);ctx.moveTo(W*.16,H*.335);ctx.lineTo(W*.38,H*.335);ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(W*.16,H*.2,W*.22,H*.27);ctx.clip();ctx.strokeStyle='#b5c9d8';ctx.lineWidth=1;const angle=-100*Math.PI/180;for(const r of rain){ctx.beginPath();const len=.025;ctx.moveTo(r.x*W,r.y*H);ctx.lineTo((r.x+Math.cos(angle)*len)*W,(r.y-Math.sin(angle)*len)*H);ctx.stroke()}ctx.restore()}
/* =============================================================
   🏠 12. HABITACIÓN / OBJETOS
   ============================================================= */
function roomDraw(){ctx.fillStyle='#202126';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.strokeRect(W*.07,H*.12,W*.86,H*.76);ctx.fillStyle='#15151a';ctx.fillRect(W*.07,H*.72,W*.86,H*.16);windowDraw();ctx.fillStyle=door?'#000':'#30231f';ctx.fillRect(W*.79,H*.27,W*.11,H*.45);ctx.strokeStyle='#777';ctx.strokeRect(W*.79,H*.27,W*.11,H*.45);if(!door){ctx.fillStyle='#d8b66a';ctx.beginPath();ctx.arc(W*.815,H*.5,5,0,Math.PI*2);ctx.fill()}const sx=W*.745,sy=H*.485;ctx.fillStyle='#999';ctx.fillRect(sx,sy,W*.025,H*.075);ctx.strokeStyle='#444';ctx.strokeRect(sx,sy,W*.025,H*.075);ctx.fillStyle=light?'#eee':'#222';ctx.fillRect(sx+W*.004,sy+H*.012,W*.017,H*.05);ctx.fillStyle='#5a4635';ctx.fillRect(W*.11,H*.68,W*.055,H*.08);ctx.strokeStyle='#3b2d23';ctx.lineWidth=2;ctx.strokeRect(W*.11,H*.68,W*.055,H*.08);ctx.fillStyle='#385c3b';ctx.fillRect(W*.136,H*.59,W*.006,H*.10);for(const p of [[.115,.57,-.35],[.13,.55,.1],[.145,.57,.45],[.125,.52,-.1],[.145,.51,.25]]){ctx.save();ctx.translate(W*p[0],H*p[1]);ctx.rotate(p[2]);ctx.beginPath();ctx.ellipse(0,0,W*.018,H*.045,0,0,Math.PI*2);ctx.fill();ctx.restore()}const pw=piano.w*W,ph=piano.h*H,px=(W-pw)/2,py=(H-ph)/2;piano.x=px/W;piano.y=py/H;ctx.fillStyle='#171218';ctx.fillRect(px,py,pw,ph*.72);const ww=pw/7;for(let i=0;i<7;i++){ctx.fillStyle='#f0eee8';ctx.fillRect(px+i*ww,py+ph*.27,ww-1,ph*.45);ctx.strokeStyle='#555';ctx.strokeRect(px+i*ww,py+ph*.27,ww-1,ph*.45)}for(const i of [1,2,4,5,6]){ctx.fillStyle='#15151a';ctx.fillRect(px+i*ww-ww*.29,py+ph*.27,ww*.58,ph*.29)}drawCat(cat.x*W,cat.y*H,light);drawHand(player.x*W,player.y*H);if(near){ctx.fillStyle='#fff';ctx.font='13px Arial';ctx.textAlign='center';ctx.fillText(near.startsWith('piano:')?'E · tocar tecla':'E · interactuar',player.x*W,player.y*H-24)}}
/* =============================================================
   🐈‍⬛ 13. GATO NPC
   ============================================================= */
function drawCat(x,y,isLit){ctx.save();ctx.translate(x,y);if(!isLit){ctx.fillStyle='#d7b85a';ctx.shadowColor='#d7b85a';ctx.shadowBlur=8;ctx.beginPath();ctx.ellipse(-5,-5,2.5,3.5,0,0,Math.PI*2);ctx.ellipse(5,-5,2.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.restore();return}ctx.fillStyle='#17151a';ctx.strokeStyle='#09080a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,5,15,9,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-11,-1);ctx.lineTo(-10,-16);ctx.lineTo(-2,-10);ctx.lineTo(2,-10);ctx.lineTo(10,-16);ctx.lineTo(11,-1);ctx.quadraticCurveTo(8,9,0,10);ctx.quadraticCurveTo(-8,9,-11,-1);ctx.fill();ctx.stroke();ctx.fillStyle='#d7b85a';ctx.beginPath();ctx.ellipse(-5,-5,2.5,3.5,0,0,Math.PI*2);ctx.ellipse(5,-5,2.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-5,-6);ctx.lineTo(-5,-3);ctx.moveTo(5,-6);ctx.lineTo(5,-3);ctx.stroke();ctx.strokeStyle='#17151a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(13,5);ctx.quadraticCurveTo(22,-2,18,-9);ctx.stroke();ctx.restore()}
/* =============================================================
   🖐️ 14. PERSONAJE / MANO
   ============================================================= */
function drawHand(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(-.25);ctx.fillStyle='#f0d0b0';ctx.strokeStyle='#8c6d5a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-7,10);ctx.quadraticCurveTo(-10,2,-7,-5);ctx.lineTo(-5,-17);ctx.quadraticCurveTo(-4,-20,-2,-19);ctx.quadraticCurveTo(0,-19,0,-16);ctx.lineTo(1,-8);ctx.lineTo(2,-21);ctx.quadraticCurveTo(3,-24,5,-23);ctx.quadraticCurveTo(7,-22,7,-19);ctx.lineTo(7,-8);ctx.lineTo(9,-18);ctx.quadraticCurveTo(10,-21,12,-20);ctx.quadraticCurveTo(14,-19,13,-16);ctx.lineTo(12,-6);ctx.lineTo(14,-13);ctx.quadraticCurveTo(15,-16,17,-15);ctx.quadraticCurveTo(19,-14,18,-11);ctx.lineTo(15,4);ctx.quadraticCurveTo(12,13,3,14);ctx.quadraticCurveTo(-4,14,-7,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
/* =============================================================
   🎬 15. GAME LOOP
   ============================================================= */
function draw(){ctx.clearRect(0,0,W,H);if(light)roomDraw();else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);windowDraw();drawCat(cat.x*W,cat.y*H,false);drawHand(player.x*W,player.y*H)}}function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Habitación</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#202126}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:18px;left:20px;color:white;font:14px Arial;text-shadow:0 2px 5px #000}</style></head><body><canvas id="game"></canvas><div id="hud"><b>LA HABITACIÓN</b><br>WASD · E interactuar · L luz · CLICK</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,light=true,door=false,near='';const keys={};const player={x:.22,y:.68,s:.008};const cat={x:.68,tx:.68,timer:0};const rain=[];for(let i=0;i<36;i++)rain.push({x:.16+Math.random()*.22,y:.2+Math.random()*.27,v:.002+Math.random()*.002});const piano={x:0,y:0,w:.24,h:.25};let audioCtx=null;const whiteNotes=[261.63,293.66,329.63,349.23,392,440,493.88],blackNotes={1:277.18,2:311.13,4:369.99,5:415.3,6:466.16};
function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='l')toggleLight();if(k==='e'&&near)interact(near)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function toggleLight(){ensureAudio();light=!light;playSwitchSound(light)}function toggleDoor(){ensureAudio();door=!door;playDoorSound()}function interact(k){if(k==='light')toggleLight();else if(k==='door')toggleDoor();else if(k==='cat')playPurr();else if(k.startsWith('piano:')){const [_,type,idx]=k.split(':');playNote(type==='black'?blackNotes[+idx]:whiteNotes[+idx])}}
function playNote(freq){ensureAudio();const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.22,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.9);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.95)}
function playDoorSound(){ensureAudio();const now=audioCtx.currentTime;[0,.12,.27].forEach((t,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(150-i*18,now+t);o.frequency.exponentialRampToValueAtTime(65,now+t+.09);g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.09,now+t+.012);g.gain.exponentialRampToValueAtTime(.0001,now+t+.11);o.connect(g);g.connect(audioCtx.destination);o.start(now+t);o.stop(now+t+.12)})}
function playSwitchSound(on){ensureAudio();const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=on?1050:760;g.gain.setValueAtTime(.055,now);g.gain.exponentialRampToValueAtTime(.0001,now+.055);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.06)}
/* 🐈 PRR: misma receta, solo más largo. */
function playPurr(){ensureAudio();const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(55,now);o.frequency.exponentialRampToValueAtTime(42,now+1.15);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.08,now+.03);g.gain.exponentialRampToValueAtTime(.0001,now+1.5);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+1.55)}
function catHit(mx,my){const cx=cat.x,cy=(H*.72-14)/H;return Math.hypot(mx-cx,my-cy)<.065}
function hitPiano(mx,my){const px=piano.x,py=piano.y,pw=piano.w,ph=piano.h,ww=pw/7,top=py+ph*.27,bottom=py+ph*.72;if(mx<px||mx>px+pw||my<top||my>bottom)return false;for(const i of [1,2,4,5,6]){const bx=px+i*ww-ww*.29;if(mx>=bx&&mx<=bx+ww*.58&&my>=top&&my<=py+ph*.56){playNote(blackNotes[i]);return true}}playNote(whiteNotes[Math.max(0,Math.min(6,Math.floor((mx-px)/ww)))]);return true}
addEventListener('click',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/W,my=(e.clientY-r.top)/H;if(catHit(mx,my)){playPurr();return}if(hitPiano(mx,my))return;if(mx>=.745&&mx<=.77&&my>=.47&&my<=.56)interact('light');else if(mx>=.79&&mx<=.9&&my>=.27&&my<=.72)interact('door')});
function pianoKeyAt(x,y){const px=.5-piano.w/2,py=.5-piano.h/2,pw=piano.w,ph=piano.h,ww=pw/7,top=py+ph*.27,bottom=py+ph*.72;if(x<px||x>px+pw||y<top||y>bottom)return null;for(const i of [1,2,4,5,6]){const bx=px+i*ww-ww*.29;if(x>=bx&&x<=bx+ww*.58&&y>=top&&y<=py+ph*.56)return `piano:black:${i}`}return `piano:white:${Math.max(0,Math.min(6,Math.floor((x-px)/ww)))}`}
function lightAt(x,y){return x>=.745&&x<=.77&&y>=.47&&y<=.56?'light':null}
function update(){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),m=Math.hypot(dx,dy)||1;player.x=Math.max(.08,Math.min(.92,player.x+dx/m*player.s));player.y=Math.max(.14,Math.min(.86,player.y+dy/m*player.s));cat.timer--;if(cat.timer<=0){cat.timer=120+Math.random()*240;cat.tx=.13+Math.random()*.72}const d=cat.tx-cat.x;if(Math.abs(d)>.004)cat.x+=Math.sign(d)*.0007;cat.x=Math.max(.13,Math.min(.87,cat.x));const a=-100*Math.PI/180;for(const r of rain){r.x+=Math.cos(a)*r.v;r.y+=-Math.sin(a)*r.v;if(r.y>.47||r.x<.14){r.y=.2;r.x=.16+Math.random()*.22}}near=pianoKeyAt(player.x,player.y)||lightAt(player.x,player.y)||'';if(!near&&player.x>=.79&&player.x<=.9&&player.y>=.27&&player.y<=.72)near='door';if(!near&&catHit(player.x,player.y))near='cat'}
function windowDraw(){ctx.fillStyle='#26384b';ctx.fillRect(W*.16,H*.2,W*.22,H*.27);ctx.strokeStyle='#777';ctx.lineWidth=4;ctx.strokeRect(W*.16,H*.2,W*.22,H*.27);ctx.beginPath();ctx.moveTo(W*.27,H*.2);ctx.lineTo(W*.27,H*.47);ctx.moveTo(W*.16,H*.335);ctx.lineTo(W*.38,H*.335);ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(W*.16,H*.2,W*.22,H*.27);ctx.clip();ctx.strokeStyle='#b5c9d8';ctx.lineWidth=1;const a=-100*Math.PI/180;for(const r of rain){ctx.beginPath();const len=.025;ctx.moveTo(r.x*W,r.y*H);ctx.lineTo((r.x+Math.cos(a)*len)*W,(r.y-Math.sin(a)*len)*H);ctx.stroke()}ctx.restore()}
function roomDraw(){ctx.fillStyle='#202126';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.strokeRect(W*.07,H*.12,W*.86,H*.76);ctx.fillStyle='#15151a';ctx.fillRect(W*.07,H*.72,W*.86,H*.16);windowDraw();ctx.fillStyle=door?'#000':'#30231f';ctx.fillRect(W*.79,H*.27,W*.11,H*.45);ctx.strokeStyle='#777';ctx.strokeRect(W*.79,H*.27,W*.11,H*.45);if(!door){ctx.fillStyle='#d8b66a';ctx.beginPath();ctx.arc(W*.815,H*.5,5,0,Math.PI*2);ctx.fill()}const sx=W*.745,sy=H*.485;ctx.fillStyle='#999';ctx.fillRect(sx,sy,W*.025,H*.075);ctx.strokeStyle='#444';ctx.strokeRect(sx,sy,W*.025,H*.075);ctx.fillStyle=light?'#eee':'#222';ctx.fillRect(sx+W*.004,sy+H*.012,W*.017,H*.05);ctx.fillStyle='#5a4635';ctx.fillRect(W*.11,H*.68,W*.055,H*.08);ctx.strokeStyle='#3b2d23';ctx.lineWidth=2;ctx.strokeRect(W*.11,H*.68,W*.055,H*.08);ctx.fillStyle='#385c3b';ctx.fillRect(W*.136,H*.59,W*.006,H*.10);for(const p of [[.115,.57,-.35],[.13,.55,.1],[.145,.57,.45],[.125,.52,-.1],[.145,.51,.25]]){ctx.save();ctx.translate(W*p[0],H*p[1]);ctx.rotate(p[2]);ctx.beginPath();ctx.ellipse(0,0,W*.018,H*.045,0,0,Math.PI*2);ctx.fill();ctx.restore()}const pw=piano.w*W,ph=piano.h*H,px=(W-pw)/2,py=(H-ph)/2;piano.x=px/W;piano.y=py/H;ctx.fillStyle='#171218';ctx.fillRect(px,py,pw,ph*.72);const ww=pw/7;for(let i=0;i<7;i++){ctx.fillStyle='#f0eee8';ctx.fillRect(px+i*ww,py+ph*.27,ww-1,ph*.45);ctx.strokeStyle='#555';ctx.strokeRect(px+i*ww,py+ph*.27,ww-1,ph*.45)}for(const i of [1,2,4,5,6]){ctx.fillStyle='#15151a';ctx.fillRect(px+i*ww-ww*.29,py+ph*.27,ww*.58,ph*.29)}drawCat(cat.x*W,floorCatY(),light);drawHand(player.x*W,player.y*H);if(near){ctx.fillStyle='#fff';ctx.font='13px Arial';ctx.textAlign='center';ctx.fillText(near.startsWith('piano:')?'E · tocar tecla':'E · interactuar',player.x*W,player.y*H-24)}}
function floorCatY(){return H*.72-14}function drawCat(x,y,isLit){ctx.save();ctx.translate(x,y);if(!isLit){ctx.fillStyle='#d7b85a';ctx.shadowColor='#d7b85a';ctx.shadowBlur=8;ctx.beginPath();ctx.ellipse(-5,-5,2.5,3.5,0,0,Math.PI*2);ctx.ellipse(5,-5,2.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.restore();return}ctx.fillStyle='#17151a';ctx.strokeStyle='#09080a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,5,15,9,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-11,-1);ctx.lineTo(-10,-16);ctx.lineTo(-2,-10);ctx.lineTo(2,-10);ctx.lineTo(10,-16);ctx.lineTo(11,-1);ctx.quadraticCurveTo(8,9,0,10);ctx.quadraticCurveTo(-8,9,-11,-1);ctx.fill();ctx.stroke();ctx.fillStyle='#d7b85a';ctx.beginPath();ctx.ellipse(-5,-5,2.5,3.5,0,0,Math.PI*2);ctx.ellipse(5,-5,2.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17151a';ctx.beginPath();ctx.ellipse(-5,-5,.8,2.2,0,0,Math.PI*2);ctx.ellipse(5,-5,.8,2.2,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#17151a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(13,5);ctx.quadraticCurveTo(22,-2,18,-9);ctx.stroke();ctx.restore()}
function drawHand(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(-.25);ctx.fillStyle='#f0d0b0';ctx.strokeStyle='#8c6d5a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-7,10);ctx.quadraticCurveTo(-10,2,-7,-5);ctx.lineTo(-5,-17);ctx.quadraticCurveTo(-4,-20,-2,-19);ctx.quadraticCurveTo(0,-19,0,-16);ctx.lineTo(1,-8);ctx.lineTo(2,-21);ctx.quadraticCurveTo(3,-24,5,-23);ctx.quadraticCurveTo(7,-22,7,-19);ctx.lineTo(7,-8);ctx.lineTo(9,-18);ctx.quadraticCurveTo(10,-21,12,-20);ctx.quadraticCurveTo(14,-19,13,-16);ctx.lineTo(12,-6);ctx.lineTo(14,-13);ctx.quadraticCurveTo(15,-16,17,-15);ctx.quadraticCurveTo(19,-14,18,-11);ctx.lineTo(15,4);ctx.quadraticCurveTo(12,13,3,14);ctx.quadraticCurveTo(-4,14,-7,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);if(light)roomDraw();else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);windowDraw();drawCat(cat.x*W,floorCatY(),false);drawHand(player.x*W,player.y*H)}}function loop(){update();draw();requestAnimationFrame(loop)}loop();</script></body></html>

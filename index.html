<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Habitación</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050508;color:#eee;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;image-rendering:auto}#hud{position:fixed;left:20px;top:18px;pointer-events:none;text-shadow:0 2px 8px #000}#title{font-size:20px;font-weight:700;letter-spacing:.08em}#hint{margin-top:6px;font-size:13px;opacity:.8}#message{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);padding:10px 16px;border:1px solid #ffffff22;background:#000b;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}#message.show{opacity:1}</style>
</head>
<body>
<canvas id="game"></canvas><div id="hud"><div id="title">LA HABITACIÓN</div><div id="hint">WASD · E interactuar · L luz</div></div><div id="message"></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),msg=document.getElementById('message');
let W,H,light=true,door=false,near='';const p={x:.22,y:.68,s:.018};const keys={};
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(1,0,0,1,0,0);x.scale(devicePixelRatio,devicePixelRatio);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='l')light=!light;if(e.key.toLowerCase()==='e'&&near){if(near==='light')light=!light; if(near==='door'){if(door) say('La puerta ya está abierta.');else{door=true;say('La puerta se abre...');}} if(near==='piano')say('Do · Re · Mi... el piano todavía funciona.')}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function say(t){msg.textContent=t;msg.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>msg.classList.remove('show'),2200)}
function loop(){update();draw();requestAnimationFrame(loop)}
function update(){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);let l=Math.hypot(dx,dy)||1;p.x=Math.max(.08,Math.min(.92,p.x+dx/l*p.s));p.y=Math.max(.14,Math.min(.86,p.y+dy/l*p.s));let objects={light:[.75,.25],door:[.88,.5],piano:[.45,.28]};near='';for(const [k,v] of Object.entries(objects)){if(Math.hypot(p.x-v[0],p.y-v[1])<.1){near=k;break}}}
function draw(){x.clearRect(0,0,innerWidth,innerHeight);x.fillStyle=light?'#202126':'#07070a';x.fillRect(0,0,innerWidth,innerHeight);let sx=innerWidth*.07,sy=innerHeight*.12,sw=innerWidth*.86,sh=innerHeight*.76;x.strokeStyle='#555';x.lineWidth=4;x.strokeRect(sx,sy,sw,sh);x.fillStyle='#15151a';x.fillRect(sx,sy+sh*.72,sw,sh*.28);
// window
x.fillStyle=light?'#26384b':'#090d14';x.fillRect(innerWidth*.16,innerHeight*.2,innerWidth*.22,innerHeight*.27);x.strokeStyle='#777';x.strokeRect(innerWidth*.16,innerHeight*.2,innerWidth*.22,innerHeight*.27);x.beginPath();x.moveTo(innerWidth*.27,innerHeight*.2);x.lineTo(innerWidth*.27,innerHeight*.47);x.moveTo(innerWidth*.16,innerHeight*.335);x.lineTo(innerWidth*.38,innerHeight*.335);x.stroke();
// door
x.fillStyle=door?'#18231b':'#30231f';x.fillRect(innerWidth*.79,innerHeight*.27,innerWidth*.11,innerHeight*.45);x.strokeStyle='#777';x.strokeRect(innerWidth*.79,innerHeight*.27,innerWidth*.11,innerHeight*.45);x.fillStyle='#d8b66a';x.beginPath();x.arc(innerWidth*.815,innerHeight*.5,5,0,Math.PI*2);x.fill();
// piano
let px=innerWidth*.38,py=innerHeight*.22;x.fillStyle='#171218';x.fillRect(px,py,innerWidth*.18,innerHeight*.22);x.fillStyle='#eee';for(let i=0;i<9;i++)x.fillRect(px+8+i*innerWidth*.018,py+innerHeight*.14,innerWidth*.016,innerHeight*.07);x.fillStyle='#222';for(let i=0;i<6;i++)x.fillRect(px+innerWidth*(.012+i*.018),py+innerHeight*.14,innerWidth*.009,innerHeight*.045);
// lamp
x.fillStyle=light?'#d5c08a':'#29262b';x.beginPath();x.arc(innerWidth*.75,innerHeight*.25,12,0,Math.PI*2);x.fill();
// player
x.fillStyle='#d9d9df';x.beginPath();x.arc(p.x*innerWidth,p.y*innerHeight,12,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(p.x*innerWidth+4,p.y*innerHeight-3,2,0,Math.PI*2);x.fill();
if(!light){x.fillStyle='#000b';x.fillRect(0,0,innerWidth,innerHeight);x.globalCompositeOperation='destination-out';let g=x.createRadialGradient(p.x*innerWidth,p.y*innerHeight,20,p.x*innerWidth,p.y*innerHeight,190);g.addColorStop(0,'#fff');g.addColorStop(1,'#000');x.fillStyle=g;x.beginPath();x.arc(p.x*innerWidth,p.y*innerHeight,190,0,Math.PI*2);x.fill();x.globalCompositeOperation='source-over'}
if(near){x.fillStyle='#fff';x.font='14px system-ui';x.textAlign='center';x.fillText('E · '+(near==='door'?'abrir puerta':near==='piano'?'tocar piano':'encender/apagar'),p.x*innerWidth,(p.y*innerHeight)-24)} }
loop();
</script></body></html>
